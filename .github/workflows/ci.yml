name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mingw:
    name: MinGW-W64 (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ release, debug ]
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --verbose

      - name: Upload binaries
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: keychron-battery-win64
          path: |
            build/keychron-battery-tray.exe
            build/keychron-battery.exe
          if-no-files-found: error

  msvc:
    name: MSVC x64 Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-msvc --parallel

      - name: Test
        run: ctest --test-dir build-msvc --output-on-failure --verbose
